<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report Page</title>
</head>
<body>
    <h1>ABC Public School</h1>

    <h2>Student Report Card</h2>

    <table border="1" >

        <tr>
            <th rowspan="2" title="Student's basic information">
                Student Information
            </th>

            <td title="Student's name">
                Name: Rohit
            </td>

            <td title="Student's roll number">
                Roll No: 101
            </td>
        </tr>

        <tr>
            <td title="Student's class">
                Class: 10th
            </td>

            <td title="Academic session">
                Session: 2025-26
            </td>
        </tr>

        <tr>
            <th>Subject</th>
            <th>Maximum Marks</th>
            <th>Obtained Marks</th>
        </tr>

        <tr>
            <td>English</td>
            <td>100</td>
            <td>85</td>
        </tr>

        <tr>
            <td>Mathematics</td>
            <td>100</td>
            <td>90</td>
        </tr>

        <tr>
            <td>Science</td>
            <td>100</td>
            <td>88</td>
        </tr>

        <tr>
            <td>Social Science</td>
            <td>100</td>
            <td>82</td>
        </tr>

        <tr>
            <td>Computer Science</td>
            <td>100</td>
            <td>95</td>
        </tr>

        <tr>
            <th colspan="2" title="Total marks obtained">
                Total
            </th>

            <td title="Total obtained marks">
                440 / 500
            </td>
        </tr>

        <tr>
            <th colspan="2" title="Overall percentage">
                Percentage
            </th>

            <td title="Overall percentage">
                88%
            </td>
        </tr>

    </table>
</body>
</html>
