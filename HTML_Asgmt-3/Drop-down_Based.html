<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Travel Destination Selection</h1>

    <form>

        <label for="country">Select Country:</label>
        <select id="country" name="country">
            <option value="india" selected>India</option>
            <option value="usa">USA</option>
            <option value="uk">United Kingdom</option>
            <option value="australia">Australia</option>
        </select>

        <br><br>

        <label for="state">Select State:</label>
        <select id="state" name="state">
            <option value="uttar-pradesh" selected>Uttar Pradesh</option>
            <option value="rajasthan">Rajasthan</option>
            <option value="goa">Goa</option>
            <option value="himachal-pradesh">Himachal Pradesh</option>
        </select>

        <br><br>

        <label for="city">Select City:</label>
        <select id="city" name="city">
            <option value="mathura" selected>Mathura</option>
            <option value="agra">Agra</option>
            <option value="jaipur">Jaipur</option>
            <option value="manali">Manali</option>
        </select>

        <br><br>

        <label for="place">Favorite Tourist Place:</label>
        <select id="place" name="place">
            <option value="taj-mahal" selected>Taj Mahal</option>
            <option value="goa-beach">Goa Beach</option>
            <option value="manali-hills">Manali Hills</option>
            <option value="hawa-mahal">Hawa Mahal</option>
        </select>

    </form>

    <h2>Your Choices</h2>

    <p>
        My selected country is <strong>India</strong>,
        state is <strong>Uttar Pradesh</strong>,
        city is <strong>Mathura</strong>,
        and my favorite tourist place is
        <strong>Taj Mahal</strong>.
    </p>
</body>
</html>
