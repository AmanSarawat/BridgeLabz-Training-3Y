<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">

        <div class="card">

            <!-- Front Side -->
            <div class="front">
                <h2>Nature</h2>
                <img src="nature.jpg" alt="Nature Image">
            </div>

            <!-- Back Side -->
            <div class="back">
                <h2>About</h2>
                <p>
                    Nature offers beauty, peace, and fresh air.
                    It inspires creativity and helps us stay connected
                    with the environment.
                </p>
            </div>

        </div>

    </div>

</body>
</html>
