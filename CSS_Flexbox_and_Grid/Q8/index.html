<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Responsive Photo Gallery</h1>

    <div class="gallery">

        <figure class="card">
            <img src="images/photo1.jpg" alt="Mountain">
            <figcaption>Beautiful Mountain</figcaption>
        </figure>

        <figure class="card">
            <img src="images/photo2.jpg" alt="Beach">
            <figcaption>Sunny Beach</figcaption>
        </figure>

        <figure class="card">
            <img src="images/photo3.jpg" alt="Forest">
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure class="card">
            <img src="images/photo4.jpg" alt="City">
            <figcaption>Modern City</figcaption>
        </figure>

        <figure class="card">
            <img src="images/photo5.jpg" alt="Lake">
            <figcaption>Peaceful Lake</figcaption>
        </figure>

        <figure class="card">
            <img src="images/photo6.jpg" alt="Desert">
            <figcaption>Golden Desert</figcaption>
        </figure>

    </div>

</body>
</html>
