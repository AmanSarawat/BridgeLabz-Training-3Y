<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Flexbox & Grid Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="logo">MyLogo</div>

        <nav class="nav">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- Main Grid -->
    <main class="container">

        <!-- Article -->
        <section class="article">
            <h1 class="title">Welcome to My Website</h1>

            <p>
                This webpage combines Flexbox, CSS Grid, media queries,
                and CSS animation to create a responsive layout.
            </p>

            <!-- Flexbox Boxes -->
            <div class="box-container">
                <div class="box">HTML</div>
                <div class="box">CSS</div>
                <div class="box">JavaScript</div>
            </div>
        </section>

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Sidebar</h2>
            <ul>
                <li>Latest News</li>
                <li>Categories</li>
                <li>Archives</li>
                <li>Contact Info</li>
            </ul>
        </aside>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2026 Aman Saraswat | All Rights Reserved</p>
    </footer>

</body>
</html>
