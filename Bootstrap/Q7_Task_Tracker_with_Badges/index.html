<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <!-- Header -->
  <header class="bg-primary text-white py-4">
    <div class="container d-flex justify-content-between align-items-center">
      <h2 class="fw-bold mb-0">Task Tracker</h2>

      <!-- Pending Counter Badge -->
      <span class="badge bg-warning text-dark fs-6">
        Pending: 5
      </span>
    </div>
  </header>

  <main class="container my-5">

    <div class="card shadow-sm p-4">

      <h3 class="text-center mb-4">Today's Tasks</h3>

      <!-- Task List -->
      <ul class="list-group">

        <li class="list-group-item d-flex justify-content-between align-items-center">
          Complete Bootstrap Assignment
          <span class="badge bg-danger">High</span>
        </li>

        <li class="list-group-item d-flex justify-content-between align-items-center">
          Practice Java DSA
          <span class="badge bg-warning text-dark">Medium</span>
        </li>

        <li class="list-group-item d-flex justify-content-between align-items-center">
          Update LinkedIn Profile
          <span class="badge bg-success">Low</span>
        </li>

        <li class="list-group-item d-flex justify-content-between align-items-center">
          Revise Compiler Design
          <span class="badge bg-danger">High</span>
        </li>

        <li class="list-group-item d-flex justify-content-between align-items-center">
          Read English Vocabulary
          <span class="badge bg-warning text-dark">Medium</span>
        </li>

      </ul>

      <!-- Completed Button -->
      <div class="text-center mt-4">
        <button class="btn btn-success">
          Completed
          <span class="badge bg-light text-dark ms-1">12</span>
        </button>
      </div>

    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3">
    © 2026 Task Tracker
  </footer>

</body>
</html>
