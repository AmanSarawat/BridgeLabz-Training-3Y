<!DOCTYPE html>
<html>
<head>
    <title>HTML Entities</title>
</head>
<body>

    <h2>HTML Entities Example</h2>

    <p>
        Less than: &lt; <br>
        Greater than: &gt; <br>
        Ampersand: &amp; <br>
        Double Quote: &quot; <br>
        Single Quote: &apos;
    </p>

    <p>
        Copyright: &copy; 2026 <br>
        Trademark: &trade; <br>
        Registered: &reg;
    </p>

</body>
</html>
