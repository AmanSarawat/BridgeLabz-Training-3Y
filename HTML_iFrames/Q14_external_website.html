<!DOCTYPE html>
<html>
<head>
    <title>External Website in iframe</title>
</head>
<body>

    <h2>Wikipedia Website</h2>

    <iframe
        src="https://www.wikipedia.org"
        title="Wikipedia"
        width="100%"
        height="500">
    </iframe>

    <p>
        Some websites may not allow embedding for security reasons.
    </p>

</body>
</html>
