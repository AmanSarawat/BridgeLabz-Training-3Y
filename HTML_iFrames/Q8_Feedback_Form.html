<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>
</head>
<body>

    <h2>Feedback Form</h2>

    <form method="post" action="#">

        <label>Enter Your Feedback:</label><br>
        <textarea name="feedback" rows="5" cols="40" required></textarea>

        <br><br>

        <label>Rate Your Experience:</label><br>

        <input type="radio" name="rating" value="Good" required>
        <label>Good</label><br>

        <input type="radio" name="rating" value="Average">
        <label>Average</label><br>

        <input type="radio" name="rating" value="Poor">
        <label>Poor</label><br><br>

        <input type="submit" value="Submit Feedback">

    </form>

</body>
</html>
