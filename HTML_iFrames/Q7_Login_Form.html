<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>
</head>
<body>

    <h2>User Login</h2>

    <form>

        <label>Username:</label><br>
        <input type="text" name="username" required><br><br>

        <label>Password:</label><br>
        <input type="password" name="password" required><br><br>

        <!-- 
        CSRF Token (Cross-Site Request Forgery Token):
        It is a hidden security value used to verify that the form
        request comes from the legitimate website and helps prevent
        unauthorized form submissions.
        -->

        <input type="hidden" name="csrf_token" value="ABC123XYZ456">

        <input type="submit" value="Login">
        <input type="reset" value="Clear">

    </form>

</body>
</html>
