<!DOCTYPE html>
<html>
<head>
    <title>Form Page</title>
</head>
<body>

    <h2>Simple Form</h2>

    <form action="result.html" method="get" target="resultFrame">

        <label>Enter Your Name:</label><br>
        <input type="text" name="name" required><br><br>

        <input type="submit" value="Submit">

    </form>

    <br>

    <!-- Result page will load here -->
    <iframe
        name="resultFrame"
        width="100%"
        height="150"
        title="Result Frame">
    </iframe>

</body>
</html>
