<body>

    <h2>Long and Short Quotations</h2>

    <p><b>Long Quote:</b></p>

    <blockquote>
        The future belongs to those who believe in the beauty of their dreams.
        Success comes through hard work &amp; determination.
    </blockquote>

    <p>
        My teacher always says,
        <q>Practice every day to become better.</q>
        This advice inspires me to keep learning.
    </p>
