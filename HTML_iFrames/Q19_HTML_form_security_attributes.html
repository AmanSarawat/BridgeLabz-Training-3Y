<!DOCTYPE html>
<html>
<head>
    <title>Secure Login Form</title>
</head>
<body>

    <h2>Login Form</h2>

    <form action="#" method="post" autocomplete="off">

        <label>Username:</label><br>
        <input type="text" name="username"
               placeholder="Enter username" required>
        <br><br>

        <label>Email:</label><br>
        <input type="email" name="email"
               placeholder="Enter email" required>
        <br><br>

        <label>Password:</label><br>
        <input type="password" name="password"
               placeholder="Enter password" required>
        <br><br>

        <input type="submit" value="Login">

    </form>

    <hr>

    <p>
        <b>Note:</b> Turning off <code>autocomplete</code> prevents the browser
        from automatically filling previously saved usernames, emails, or passwords.
        This helps improve security, especially on shared or public computers.
    </p>

</body>
</html>
